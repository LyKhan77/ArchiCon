schema_version: 1
profile: room-tour
processing:
  keyframe_target_fps: 2
  sampling_mode: adaptive
  adaptive_target_fps: 4
  motion_threshold: 0.03
  matching: sequential
  overlap: 32
  loop_detection: false
  global_alignment: true
  max_exhaustive_frames: 400
  depth_resolution: 504
  confidence_quantile: 0.02
  voxel_divisor: 80
  sdf_voxels: 8
  max_refinement_rounds: 2
  max_candidates_per_round: 2
review:
  provider: manual
  required: true
  max_images: 12
delivery:
  root: end_product
