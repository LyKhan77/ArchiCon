schema_version: 1
profile: dense-camera
processing:
  keyframe_target_fps: 4
  sampling_mode: uniform
  matching: sequential
  overlap: 64
  max_image_size: 1600
  max_features: 8192
  loop_detection: false
  global_alignment: true
  depth_resolution: 504
  confidence_quantile: 0.02
  voxel_divisor: 80
  sdf_voxels: 8
  max_refinement_rounds: 2
  max_candidates_per_round: 2
review:
  provider: manual
  required: true
  max_images: 12
delivery:
  root: end_product
