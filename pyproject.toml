[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "room-reconstruction-part2"
version = "0.1.0"
description = "ArchiCon video-to-mesh, draft floorplan and offline room tour pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
audit = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]
camera = ["pycolmap==4.2.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["room_reconstruction*"]
namespaces = false
